name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Stats (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: caitlon
          template: classic
          base: header, repositories
          config_timezone: Europe/Prague
          filename: stats-light.svg
          output_action: none

      - name: Stats (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: caitlon
          template: classic
          base: header, repositories
          config_timezone: Europe/Prague
          config_theme: github-dark
          filename: stats-dark.svg
          output_action: none

      - name: Languages (Light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: caitlon
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_sections: most-used
          filename: languages-light.svg
          output_action: none

      - name: Languages (Dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: caitlon
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_sections: most-used
          config_theme: github-dark
          filename: languages-dark.svg
          output_action: none

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /metrics_renders
          publish_branch: output
          destination_dir: metrics
          commit_message: "Update metrics [skip ci]"
